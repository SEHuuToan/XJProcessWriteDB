version: '3.8'

services:
  # 1. Database MySQL
  mysql_db:
    image: mysql:8.0
    container_name: xj_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: XJProcessDB
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. MQTT Broker (EMQX) - Nếu bạn đã có broker riêng thì có thể bỏ service này và trỏ MQTT_BROKER_URL về IP đó
  mqtt_broker:
    image: emqx/emqx:5.8.0
    container_name: xj_emqx
    restart: always
    ports:
      - "1883:1883"
      - "18083:18083" # Dashboard quản lý EMQX (admin / public)

  # 3. Node.js Backend Service
  backend_service:
    build: .
    container_name: xj_process_write_db
    restart: always
    depends_on:
      mysql_db:
        condition: service_healthy
      mqtt_broker:
        condition: service_started
    ports:
      - "3000:3000" # Express HTTP API
      - "8080:8080" # WebSocket Server
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      PORT: 3000
      WS_PORT: 8080
      DB_HOST: mysql_db
      DB_USER: root
      DB_PASSWORD: rootpassword123
      DB_NAME: XJProcessDB
      MQTT_BROKER_URL: mqtt://mqtt_broker:1883
      MQTT_TOPIC: xj/plc/pump/#

volumes:
  mysql_data: