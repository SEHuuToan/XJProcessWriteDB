version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: xj_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: XJProcessDB
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt_broker:
    image: emqx/emqx:5.8.0
    container_name: xj_emqx
    restart: always
    ports:
      - "1883:1883"
      - "18083:18083"

  # 1. Container chuyên chạy RESTful API cho Front-end
  api_service:
    build: .
    container_name: xj_api_server
    restart: always
    command: npm run dev:api
    depends_on:
      mysql_db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      PORT: 3000
      DB_HOST: mysql_db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: XJProcessDB

  # 2. Container chuyên chạy Background Worker (MQTT + WebSocket)
  mqtt_worker_service:
    build: .
    container_name: xj_mqtt_worker
    restart: always
    command: npm run dev:worker
    depends_on:
      mysql_db:
        condition: service_healthy
      mqtt_broker:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      WS_PORT: 8080
      DB_HOST: mysql_db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: XJProcessDB
      MQTT_BROKER_URL: mqtt://mqtt_broker:1883
      MQTT_TOPIC: xj/plc/pump/#

volumes:
  mysql_data: